interface:
  display_name: "星栀写作插件"
  short_description: "对白优先推进主线，按人设、情绪与场景细分声线，同场一人心理并留白，完整章2700—3300字"
  default_prompt: "请使用 $write-serial-fiction，按章纲、卷纲和最新适用阶段资料写作，全书优先以实际对白推进主线，战斗突出动作、即时后果与人物形象，暧昧可以通过含蓄动作和回应推进，其他场景按处境调整。按本书当前人设匹配声线参考，读取对应性格的本场情绪与场景调整，结合当前环境、目的、关系阶段和知情范围决定台词；对白把人物当下的口气说完整，叙述把动作和情绪接顺；按人设、情绪、时代与场合自然选用日常口语和网络表达，不重复绕话，不反复核对已经明确的同一件事或身体情况，减少重复用词，禁止模板化描写与句式，动作贴合语境；需要面部描写时读取微表情参考，结合人设、当前情绪与场景写眼神、泪水和唇角的变化，允许贴合语境的形容与比喻，不套固定反应或从表情读心；连接词、语气成分与小修饰词可比极简表达稍多一些，保留商量、反问、让步、强调与自然节奏，承接动作先后、轻重、速度和情绪延续，让行文连贯有起伏；分量依当前人物与场景调整，避免机械堆叠与虚构时间关系，不统一放慢动作。服从本书视角范围，同一连续场景只直接展开一位主要人物的心理，允许符合人设的第一人称口语独白；其他人物通过观察、猜测、对白、微表情和行动回应，不自动知道未表达的念头。禁止作者式总结和未来预告；完整章正文2700—3300字并留具体钩子，禁止章末升华总结；涉及旧事或伏笔时回读相关旧阶段资料。"
  icon_small: "assets/icon.svg"
  icon_large: "assets/icon.svg"
policy:
  allow_implicit_invocation: true
